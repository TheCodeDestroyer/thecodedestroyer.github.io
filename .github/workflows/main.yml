name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm tcd-scripts lint --only=eslint

      - name: Run Prettier
        run: pnpm tcd-scripts lint --only=prettier

      - name: Run TypeScript
        run: pnpm tcd-scripts lint --only=tsc

      - name: Build
        run: pnpm build
